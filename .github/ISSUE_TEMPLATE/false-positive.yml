name: False positive
description: dscheck reported a value that is actually on-system (or shouldn't be checked)
title: 'FP: '
labels: [fp]
body:
  - type: markdown
    attributes:
      value: |
        False positives are the most important bug class in this project — a linter
        that cries wolf gets disabled. Every confirmed FP becomes a permanent
        regression fixture and an entry on the [release scoreboard](https://github.com/oddurs/dscheck/blob/main/RELEASES.md).
        The fields below are exactly what's needed to reproduce and fixture it.
  - type: textarea
    id: finding
    attributes:
      label: The finding, verbatim
      description: Copy the whole line, including the rule name.
      placeholder: '✖ 12:9  Raw color #2a2520 — use var(--color-x) (ΔEOK 0.040)  dscheck/no-raw-color'
      render: text
    validations: { required: true }
  - type: textarea
    id: code
    attributes:
      label: The smallest code that triggers it
      render: tsx
    validations: { required: true }
  - type: textarea
    id: tokens
    attributes:
      label: The relevant part of your token source
      description: The `@theme` block, DTCG entries, or `:root` declarations involved.
      render: css
    validations: { required: true }
  - type: textarea
    id: config
    attributes:
      label: Your dscheck.config.json (if any)
      render: json
  - type: textarea
    id: why
    attributes:
      label: Why this is on-system
      description: What should dscheck have concluded, and why?
    validations: { required: true }
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: 'dscheck 0.1.0 · eslint 10.9 · tailwindcss 4.3.3 · node 22'
    validations: { required: true }
