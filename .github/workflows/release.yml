# N2: releases with zero local credentials. changesets keeps a "Version
# Packages" PR open; merging it publishes every package via npm trusted
# publishing (OIDC). Enable at npm: package settings → trusted publisher →
# this repo + workflow (RUNBOOK "Release").
name: release
on:
  push: { branches: [main] }
permissions:
  contents: write
  pull-requests: write
  id-token: write
concurrency: release-${{ github.ref }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm, registry-url: 'https://registry.npmjs.org' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # Publishing is armed by the repo variable RELEASES_ENABLED=true — set it
      # at K1 (first deliberate release; RUNBOOK "Release"). Until then the
      # action only maintains the Version Packages PR.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        if: vars.RELEASES_ENABLED == 'true'
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        if: vars.RELEASES_ENABLED != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
